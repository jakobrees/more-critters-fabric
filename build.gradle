plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"more_critters" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/more_critters.accesswidener")
}

// Automated tests in their own source set (src/gametest), never shipped in the mod jar:
// ./gradlew runGameTest (headless server game tests) and ./gradlew runClientGameTest (a real client, screenshots).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "more_critters_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib renders and animates every critter; required at run time on both sides.
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "${it}_more_critters" } }
	from("LICENSE-MORE-CRITTERS") { rename { "${it}_more_critters" } }
}
